<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nature Explorer | Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to Main Content</a>

  <header class="site-header">
    <div class="brand">
      <h1>Nature Explorer</h1>
      <p>Free image gallery inspired by nature</p>
    </div>

    <nav class="navbar" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="gallery.html" class="active">Gallery</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main id="main-content">
    <section class="page-intro">
      <h2>Nature Gallery</h2>
      <p>
        This page uses a flex layout and an <code>nth-child</code> selector to
        style images differently.
      </p>
    </section>

    <section class="photo-flex">
      <figure class="photo-item">
        <img
          src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80"
          alt="A waterfall flowing down rocks into a pool"
        />
        <figcaption>Waterfall</figcaption>
      </figure>

      <figure class="photo-item">
        <img
          src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80"
          alt="A valley with mountains and a lake"
        />
        <figcaption>Valley</figcaption>
      </figure>

      <figure class="photo-item">
        <img
          src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=900&q=80"
          alt="Misty forest with tall green trees"
        />
        <figcaption>Forest Mist</figcaption>
      </figure>

      <figure class="photo-item">
        <img
          src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=900&q=80"
          alt="Desert dunes under a blue sky"
        />
        <figcaption>Desert</figcaption>
      </figure>

      <figure class="photo-item">
        <img
          src="https://images.unsplash.com/photo-1511497584788-876760111969?auto=format&fit=crop&w=900&q=80"
          alt="Colorful hot air balloons in the sky above rock formations"
        />
        <figcaption>Sky View</figcaption>
      </figure>

      <figure class="photo-item">
        <img
          src="https://images.unsplash.com/photo-1439066615861-d1af74d74000?auto=format&fit=crop&w=900&q=80"
          alt="A field of flowers under soft sunlight"
        />
        <figcaption>Flower Field</figcaption>
      </figure>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Nature Explorer</p>
  </footer>
</body>
</html>
