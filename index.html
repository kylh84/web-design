<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive Photo Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Interactive Photo Gallery</h1>
    <p>Hover over an image to preview it above.</p>

    <div id="image" class="preview-box">
      Hover over an image below to display here.
    </div>

    <section class="gallery">
      <img
        class="preview"
        src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=900&q=80"
        alt="A peaceful mountain lake surrounded by tall trees"
        onmouseover="upDate(this)"
        onmouseout="unDo()"
      />

      <img
        class="preview"
        src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80"
        alt="Sunlight shining through a green forest"
        onmouseover="upDate(this)"
        onmouseout="unDo()"
      />

      <img
        class="preview"
        src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80"
        alt="Ocean waves reaching a sandy beach"
        onmouseover="upDate(this)"
        onmouseout="unDo()"
      />

      <img
        class="preview"
        src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80"
        alt="Snow-covered mountain peaks under a blue sky"
        onmouseover="upDate(this)"
        onmouseout="unDo()"
      />

      <img
        class="preview"
        src="https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&w=900&q=80"
        alt="A deer standing in a natural field"
        onmouseover="upDate(this)"
        onmouseout="unDo()"
      />

      <img
        class="preview"
        src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80"
        alt="A waterfall flowing over dark rocks"
        onmouseover="upDate(this)"
        onmouseout="unDo()"
      />
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
